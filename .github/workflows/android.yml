name: Build GAMLETSOL native (Kotlin/Compose)

# NOT (dürüstlük ilkesi): Bu CI yalnızca derleme + lint + birim testlerini
# doğrular (debug APK üretir). Gerçek bir Android cihazda/emülatörde kamera +
# OCR + çeviri uçtan uca DOĞRULANMADI — bu yalnızca CI'da yapılabilecek bir
# şey değil (gerçek kamera girdisi ve ML Kit model indirmesi gerektirir).
# Bkz. kök README.md "Doğrulama durumu".
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # Sürüm yayını: `v0.3.0` gibi bir etiket push'lanınca aynı derleme,
    # sürüm notlarıyla (docs/releases/<etiket>.md) kalıcı bir GitHub
    # Release'i olarak yayınlanır (bkz. en alttaki adım).
    tags: ["v*"]
    paths-ignore:
      - "legacy-flutter-mic-stt/**"
  pull_request:
    paths-ignore:
      - "legacy-flutter-mic-stt/**"

jobs:
  build:
    runs-on: ubuntu-latest
    # "latest" GitHub Release'ine APK yüklemek için gereken izin (bkz.
    # aşağıdaki "Debug APK'ları yükle" adımı) — varsayılan GITHUB_TOKEN
    # izinleri bazı repo ayarlarında salt-okunur olabilir, bu yüzden
    # burada açıkça `contents: write` istiyoruz.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # DÜZELTME (ilk sürümdeki hata): ubuntu-latest imajında `sdkmanager`
      # PATH'te DEĞİL (gerçek CI çalıştırmasında "command not found" / exit
      # code 127 ile doğrulandı — bkz. git geçmişi). `android-actions/
      # setup-android@v3`, ANDROID_HOME/ANDROID_SDK_ROOT'u kurup
      # cmdline-tools'u PATH'e ekliyor ve lisansları kabul ediyor.
      # DÜZELTME #2: varsayılan `packages: tools platform-tools` girdisi
      # artık var olmayan eski "tools" paketini istiyor ve action'ı
      # başarısızlıkla durduruyor (gerçek CI çalıştırmasında doğrulandı) —
      # yalnızca var olan `platform-tools`'u istiyoruz.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Ensure required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Unit tests (core-model, core-pipeline, core-pairing, core-transport)
        run: ./gradlew :core-model:test :core-pipeline:test :core-pairing:test :core-transport:test --stacktrace

      - name: Lint (feature-capture, app-mobile, app-tv)
        run: ./gradlew :feature-capture:lintDebug :app-mobile:lintDebug :app-tv:lintDebug --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :app-mobile:assembleDebug :app-tv:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: gamletsol-mobile-debug-apk
          path: app-mobile/build/outputs/apk/debug/app-mobile-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: gamletsol-tv-probe-debug-apk
          path: app-tv/build/outputs/apk/debug/app-tv-debug.apk

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-reports
          path: |
            feature-capture/build/reports/lint-results-debug.html
            app-mobile/build/reports/lint-results-debug.html
            app-tv/build/reports/lint-results-debug.html

      # NOT (dürüstlük ilkesi, 2026-11-09 — kullanım kılavuzu için eklendi):
      # CI'nın `actions/upload-artifact` çıktıları 90 gün sonra OTOMATİK
      # SİLİNİR ve yalnızca bu depoya push erişimi olanlarca indirilebilir
      # — bu, `docs/KULLANIM-KILAVUZU.md`'yi okuyan herkese KALICI bir
      # indirme bağlantısı vermez. Bu adım, yalnızca `main`'e push'ta
      # (pull request'lerde DEĞİL), bu iki debug APK'yı her zaman AYNI
      # "latest" GitHub Release'ine yükleyip ÖNCEKİ APK'ların üzerine
      # yazar — böylece kılavuzdaki indirme bağlantısı hep GÜNCEL ve hep
      # AYNI kalır. Bu hâlâ bir DEBUG APK'dır (imzasız/debug-signed,
      # mağaza yayını DEĞİL) — bkz. kılavuzdaki "Bilinen sınırlar" bölümü.
      - name: "Debug APK'ları 'latest' GitHub Release'ine yükle (yalnızca main push)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GAMLETSOL — en güncel debug APK'lar"
          body: |
            Bu sürüm, `main` dalındaki en güncel commit'ten (${{ github.sha }})
            otomatik olarak üretilen DEBUG APK'ları içerir — imzasız/debug-
            signed derlemelerdir, mağaza yayını değildir. Kurulum adımları
            için `docs/KULLANIM-KILAVUZU.md`'ye bakın.

            Bu sürüm her `main` push'unda GÜNCELLENİR (önceki APK'ların
            üzerine yazılır) — kalıcı bir sürüm arşivi DEĞİLDİR.
          files: |
            app-mobile/build/outputs/apk/debug/app-mobile-debug.apk
            app-tv/build/outputs/apk/debug/app-tv-debug.apk
          prerelease: true
          # Sürümlü yayınlar (v* etiketleri) depo sayfasında "Latest" olarak
          # kalsın; bu sürekli güncellenen ön sürüm onların yerini almasın.
          make_latest: false

      # Sürüm yayını (2026-11-13): `v*` etiketinde, etikete ait sürüm
      # notlarına APK'ların SHA-256 değerleri eklenir ve kalıcı bir Release
      # oluşturulur. APK'lar yine DEBUG imzalıdır (mağaza yayını değildir).
      - name: "Sürüm notlarını ve APK adlarını hazırla (yalnızca v* etiketi)"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-out
          cp app-mobile/build/outputs/apk/debug/app-mobile-debug.apk "release-out/gamletsol-telefon-${TAG}.apk"
          cp app-tv/build/outputs/apk/debug/app-tv-debug.apk "release-out/gamletsol-tv-${TAG}.apk"
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Sürüm notu bulunamadı: $NOTES" >&2
            exit 1
          fi
          {
            cat "$NOTES"
            echo
            echo "## Dosya doğrulama (SHA-256)"
            echo '```'
            (cd release-out && sha256sum *.apk)
            echo '```'
            echo "Kaynak commit: \`${GITHUB_SHA}\`"
          } > release-out/notes.md

      - name: "Sürümü GitHub Release olarak yayınla (yalnızca v* etiketi)"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GAMLETSOL ${{ github.ref_name }} (beta)"
          body_path: release-out/notes.md
          files: |
            release-out/gamletsol-telefon-${{ github.ref_name }}.apk
            release-out/gamletsol-tv-${{ github.ref_name }}.apk
          prerelease: false
          make_latest: true
