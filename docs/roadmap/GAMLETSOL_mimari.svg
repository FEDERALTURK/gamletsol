<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1380" viewBox="0 0 1700 1380" role="img" aria-labelledby="title desc">
<title id="title">GAMLETSOL — Xbox ve Profilo TV mimarisi</title>
<desc id="desc">Planlanan mimari. Xbox görüntüsü HDMI üzerinden Profilo TV'ye gider. Android telefonda kamera ve yerel OCR, metin çevirisi ve kimlik doğrulamalı altyazı aktarımı yapılır. TV alıcısının HDMI passthrough ile birleştirme yeteneği gerçek cihazda henüz test edilmemiştir.</desc>
