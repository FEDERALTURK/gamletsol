<text class="b muted" x="90" y="1241">Kamera yerine kullanılabilir; erişilebilir görüntü, oturum, izin ve koşullar önce doğrulanır.</text>
<text class="xs muted" x="90" y="1265">TV kompozisyonu kanıtından bağımsız entegrasyon riski. Bu şemada hazır bir SDK veya çalışan bağlantı varsayılmaz.</text>

