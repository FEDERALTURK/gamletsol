<text class="s" x="1127" y="1214">vaadini karşılamaz. Destek durumu açık gösterilir.</text>
<text class="s muted" x="1127" y="1252">Root veya sistem imzası tüketici MVP şartı olamaz.</text>

<rect x="60" y="1140" width="990" height="140" rx="20" fill="#ffffff" stroke="#c4852d" stroke-width="2" stroke-dasharray="10 7"/>
